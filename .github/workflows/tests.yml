name: Django CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: property_management_system
          POSTGRES_USER: gwiternz
          POSTGRES_PASSWORD: "@#93Gwiternz29#@"
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12' # Recommended: 3.12 is more stable for CI than 3.13 currently

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests
      env:
        # Credentials below match the Postgres service above
        # Password '@#93Gwiternz29#@' is encoded to '%40%2393Gwiternz29%23%40'
        DATABASE_URL: postgresql://gwiternz:%40%2393Gwiternz29%23%40@localhost:5432/property_management_system
        DJANGO_SETTINGS_MODULE: property_mgmt.settings
      run: |
        pytest
