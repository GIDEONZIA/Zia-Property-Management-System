name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: property_management_system
          POSTGRES_USER: gwiternz
          POSTGRES_PASSWORD: "password123" # Simple password avoids URL-encoding errors
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.12'
        enable-cache: true

    - name: Install Dependencies
      run: |
        uv pip install -r requirements.txt
        uv pip install pytest pytest-django

    - name: Run Tests
      env:
        # We use a simpler password here to ensure the connection string doesn't break
        DATABASE_URL: postgresql://gwiternz:password123@localhost:5432/property_management_system
        DJANGO_SETTINGS_MODULE: property_mgmt.settings
        PYTHONPATH: .
      run: |
        uv run pytest
