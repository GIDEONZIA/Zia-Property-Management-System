name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: property_management_system
          POSTGRES_USER: gwiternz
          POSTGRES_PASSWORD: "password123" # Simple password avoids URL-encoding errors
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.12'
        enable-cache: true

    - name: Install Dependencies
      run: |
        uv pip install -r requirements.txt
        uv pip install pytest pytest-django

    - name: Run Tests
      env:
        DJANGO_SETTINGS_MODULE: property_mgmt.settings
        PYTHONPATH: .
        # Provide individual variables so Django doesn't have to guess
        DB_NAME: property_management_system
        DB_USER: gwiternz
        DB_PASSWORD: "password123"
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
      run: |
        uv run pytest
