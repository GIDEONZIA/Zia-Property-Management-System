{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Thank You for Contacting Us | Zia Properties Ltd</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <meta name="description" content="Thank you for reaching out to Zia Properties Ltd. We'll respond to your inquiry soon.">
  <meta name="robots" content="noindex, follow" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
    }
    .thank-you-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .confetti-canvas {
      position: fixed;
      pointer-events: none;
      width: 100vw;
      height: 100vh;
      top: 0;
      left: 0;
      z-index: 999;
    }
  </style>
</head>
<body>

<canvas class="confetti-canvas" id="confetti"></canvas>

<div class="container thank-you-container">
  <div class="text-center p-5 bg-white rounded shadow">
    <h1 class="display-4 text-success fw-bold">Thank You!</h1>
    <p class="lead">We’ve received your submission.<br>We'll get back to you shortly.</p>
    <p class="text-muted">Redirecting to <strong>Home</strong> in <span id="countdown">5</span> seconds...</p>
    <a href="{% url 'frontend:home' %}" class="btn btn-primary">Go Now</a>
  </div>
</div>

<!-- Toast (Optional Feedback) -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true" id="thankYouToast">
    <div class="d-flex">
      <div class="toast-body">
        🎉 Submission successful! Redirecting...
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>

<!-- Bootstrap JS + Confetti -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
  // Confetti burst on load
  confetti({
    particleCount: 150,
    spread: 100,
    origin: { y: 0.6 }
  });

  // Show toast
  const toast = new bootstrap.Toast(document.getElementById('thankYouToast'));
  toast.show();

  // Countdown + Redirect
  let seconds = 5;
  const countdown = document.getElementById('countdown');
  const redirectURL = "{% url 'frontend:home' %}";

  const timer = setInterval(() => {
    seconds--;
    countdown.textContent = seconds;
    if (seconds === 0) {
      clearInterval(timer);
      window.location.href = redirectURL;
    }
  }, 1000);
</script>



</body>
</html>
