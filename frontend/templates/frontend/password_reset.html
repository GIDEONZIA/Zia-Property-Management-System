{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password | Zia Properties Ltd</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Reset your Zia Properties password securely. Enter your email to receive a reset link.">
    <meta name="robots" content="noindex, follow">

    
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Optional: Custom CSS -->
    <link rel="stylesheet" href="{% static 'frontend/css/forgot_password.css' %}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="card shadow-sm p-4" style="max-width: 420px; width: 100%;">
        <h2 class="text-center mb-3">Forgot Password</h2>
        <p class="text-muted text-center">Enter your email address and we'll send you a reset link.</p>

        <form method="post" action="{% url 'password_reset' %}">
            {% csrf_token %}

            {% if messages %}
              {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
              {% endfor %}
            {% endif %}

            <div class="mb-3">
                <label for="id_email" class="form-label">Email address</label>
                <input type="email" name="email" id="id_email" class="form-control" placeholder="your@email.com" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
        </form>

        <div class="mt-3 text-center">
            <a href="{% url 'login' %}" class="text-decoration-none">Back to Login</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
