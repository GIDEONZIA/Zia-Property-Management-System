{% extends 'base_public.html' %}
{% block title %}Processing Payment — Zia Properties{% endblock %}
{% block content %}
<div class="container d-flex align-items-center justify-content-center vh-100">
  <div class="card shadow-sm border-0 p-4 rounded-4" style="max-width:640px; width:100%;">
    <div class="row g-0 align-items-center">
      <div class="col-md-4 d-flex justify-content-center">
        <div class="spinner-border text-success" style="width:4.5rem; height:4.5rem;" role="status"></div>
      </div>
      <div class="col-md-8">
        <h4 class="mb-1">Processing your payment</h4>
        <p class="mb-2 text-muted">Please confirm the M-Pesa prompt on your phone — we are verifying the transaction.</p>

        <div id="statusBadge" class="mb-2">
          <span class="badge bg-info">Waiting for confirmation…</span>
        </div>

        <div class="progress mb-3" style="height:8px;">
          <div id="progressBar" class="progress-bar bg-success progress-bar-striped progress-bar-animated" style="width:0%"></div>
        </div>

        <div class="d-flex gap-2">
          <button id="backBtn" class="btn btn-outline-secondary btn-sm">Back to Premium</button>
          <button id="retryBtn" class="btn btn-success btn-sm d-none">Retry Payment</button>
        </div>
        <p class="text-muted small mt-3" id="debugMsg" style="word-break:break-word;"></p>
      </div>
    </div>
  </div>
</div>

<script>
  const checkoutId = "{{ checkout_id|default:request.GET.checkout_id }}";
  const statusBadge = document.getElementById('statusBadge');
  const progressBar = document.getElementById('progressBar');
  const debugMsg = document.getElementById('debugMsg');
  const backBtn = document.getElementById('backBtn');
  const retryBtn = document.getElementById('retryBtn');

  backBtn.addEventListener('click', () => {
    window.location.href = "{% url 'frontend:premium_agent' %}";
  });
  retryBtn.addEventListener('click', () => {
    window.location.href = "{% url 'frontend:premium_agent' %}";
  });

  if (!checkoutId) {
    statusBadge.innerHTML = '<span class="badge bg-danger">Missing checkout id</span>';
    debugMsg.textContent = "No checkout_id supplied. Try initiating payment again from the Premium page.";
    throw new Error("Missing checkout_id");
  }

  let attempts = 0;
  const maxAttempts = 5;    // overall timeout attempts (adjust)
  const initialInterval = 2000; // 2s first
  const maxInterval = 8000;     // up to 8s
  let currentInterval = initialInterval;

  const updateProgressUI = () => {
    attempts++;
    const percent = Math.min((attempts / maxAttempts) * 100, 100);
    progressBar.style.width = percent + '%';
    debugMsg.textContent = `Checking... attempt ${attempts}/${maxAttempts}`;
  };

  async function pollStatus() {
    try {
      const url = `{% url 'subscriptions:check_status' %}?checkout_id=${encodeURIComponent(checkoutId)}`;
      const r = await fetch(url, { method: 'GET', headers: {'X-Requested-With':'XMLHttpRequest'} });
      if (!r.ok) {
        // transient server error — show message and retry
        statusBadge.innerHTML = '<span class="badge bg-warning">Network issue — retrying</span>';
        updateProgressUI();
      } else {
        const data = await r.json();
        if (data.status === 'success') {
          statusBadge.innerHTML = '<span class="badge bg-success">Payment successful</span>';
          progressBar.style.width = '100%';
          // give the user a short celebratory pause
          setTimeout(() => {
            window.location.href = "{% url 'frontend:payment_success' %}";
          }, 900);
          return;
        } else if (data.status === 'failed') {
          statusBadge.innerHTML = '<span class="badge bg-danger">Payment failed</span>';
          debugMsg.textContent = "Payment failed. Please try again or contact support.";
          retryBtn.classList.remove('d-none');
          // optionally redirect after a short pause:
          setTimeout(() => {
            window.location.href = "{% url 'frontend:payment_failed' %}";
          }, 1200);
          return;
        } else if (data.status === 'pending' || data.status === 'not_found') {
          statusBadge.innerHTML = '<span class="badge bg-info">Waiting for confirmation…</span>';
          updateProgressUI();
        } else {
          // unexpected
          statusBadge.innerHTML = '<span class="badge bg-warning">Unknown response</span>';
          debugMsg.textContent = JSON.stringify(data);
          updateProgressUI();
        }
      }
    } catch (err) {
      statusBadge.innerHTML = '<span class="badge bg-warning">Connection error — retrying</span>';
      debugMsg.textContent = err.toString();
      updateProgressUI();
    }

    if (attempts >= maxAttempts) {
      statusBadge.innerHTML = '<span class="badge bg-danger">Timeout — could not confirm</span>';
      debugMsg.textContent = 'Payment verification timed out. Please check your phone or subscription status later.';
      retryBtn.classList.remove('d-none');
      // final fallback redirect to payment_failed after giving them a moment
      setTimeout(() => {
        window.location.href = "{% url 'frontend:payment_failed' %}";
      }, 2500);
      return;
    }

    // increase interval gradually up to maxInterval (helps reduce load)
    currentInterval = Math.min(initialInterval + Math.floor(attempts/3) * 1000, maxInterval);
    setTimeout(pollStatus, currentInterval);
  }

  // start polling after a short delay so DB has time to commit
  setTimeout(pollStatus, 1200);
</script>
{% endblock %}
