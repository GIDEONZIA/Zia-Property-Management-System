<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Property Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #343a40;
            color: #fff;
            padding: 1rem 0;
            text-align: center;
            margin-bottom: 2rem;
        }
        main {
            max-width: 700px;
            margin: 0 auto;
            padding: 2rem;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        section {
            margin-bottom: 2rem;
        }
        h2 {
            color: #495057;
            margin-bottom: 1rem;
        }
        form label {
            display: block;
            margin-bottom: 0.5rem;
            color: #212529;
        }
        input[type="text"],
        input[type="email"],
        select {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #ced4da;
            border-radius: 4px;
            background: #f1f3f5;
        }
        button[type="submit"] {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button[type="submit"]:hover {
            background-color: #0056b3;
        }
        footer {
            text-align: center;
            padding: 1rem 0;
            background: #e9ecef;
            color: #6c757d;
            margin-top: 2rem;
        }
        input[type="checkbox"] {
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Settings</h1>
    </header>
    <main>
        <section>
            <h2>Account Settings</h2>
            <form method="post" action="{% url 'update_account_settings' %}">
                {% csrf_token %}
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" value="{{ user.username }}" required>
                
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" value="{{ user.email }}" required>
                
                <button type="submit">Save Changes</button>
            </form>
        </section>
        <section>
            <h2>Notification Preferences</h2>
            <form method="post" action="{% url 'update_notifications' %}">
                {% csrf_token %}
                <label>
                    <input type="checkbox" name="email_notifications" {% if user.profile.email_notifications %}checked{% endif %}>
                    Email Notifications
                </label>
                <label>
                    <input type="checkbox" name="sms_notifications" {% if user.profile.sms_notifications %}checked{% endif %}>
                    SMS Notifications
                </label>
                <button type="submit">Update Preferences</button>
            </form>
        </section>
        <section>
            <h2>System Settings</h2>
            <form method="post" action="{% url 'update_system_settings' %}">
                {% csrf_token %}
                <label for="timezone">Timezone:</label>
                <select id="timezone" name="timezone">
                    {% for tz in timezones %}
                        <option value="{{ tz }}" {% if tz == user.profile.timezone %}selected{% endif %}>{{ tz }}</option>
                    {% endfor %}
                </select>
                
                <label for="currency">Default Currency:</label>
                <select id="currency" name="currency">
                    {% for currency in currencies %}
                        <option value="{{ currency }}" {% if currency == user.profile.currency %}selected{% endif %}>{{ currency }}</option>
                    {% endfor %}
                </select>
                
                <button type="submit">Save Settings</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Zia Property Management System</p>
    </footer>
</body>
</html>
