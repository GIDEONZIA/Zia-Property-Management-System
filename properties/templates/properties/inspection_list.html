{% extends "base.html" %}

{% block content %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<h2>Inspections</h2>
<ul>
  {% for inspection in inspections %}
    <li>{{ inspection.date }} - {{ inspection.status }}</li>
  {% empty %}
    <li>No inspections available.</li>
  {% endfor %}
</ul>
{% endblock %}
